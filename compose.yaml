services:
  opencode2api:
    build:
      context: .
      dockerfile: Dockerfile
    image: opencode2api:local
    restart: unless-stopped
    environment:
      CONFIG_PATH: /app/config.json
      LISTEN_ADDRESS: 0.0.0.0:8080
    ports:
      - "${OPENCODE2API_PORT:-8080}:8080"
    volumes:
      - .:/app
      - opencode2api-state:/var/lib/opencode2api
      - go-build-cache:/root/.cache/go-build
      - go-module-cache:/go/pkg/mod
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  opencode2api-state:
  go-build-cache:
  go-module-cache:
